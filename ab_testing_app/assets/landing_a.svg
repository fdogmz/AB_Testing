<svg width="900" height="1400" viewBox="0 0 900 1400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mockup de landing page A para MarketPro</title>
  <desc id="desc">Version tradicional y sobria de una landing page para descargar una guia gratuita de marketing digital.</desc>

  <!-- Background -->
  <rect width="900" height="1400" fill="#F5F7FA"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="96" fill="#FFFFFF"/>
  <rect x="0" y="94" width="900" height="2" fill="#D9E0E7"/>
  <circle cx="82" cy="48" r="24" fill="#5E7C91"/>
  <path d="M69 58L77 37L84 51L91 37L100 58" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="58" fill="#243746" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">MarketPro</text>
  <text x="648" y="55" fill="#6D7B87" font-family="Arial, Helvetica, sans-serif" font-size="18">Recursos</text>
  <text x="752" y="55" fill="#6D7B87" font-family="Arial, Helvetica, sans-serif" font-size="18">Contacto</text>

  <!-- Main content panel -->
  <rect x="70" y="145" width="760" height="1110" rx="12" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>

  <!-- Hero copy -->
  <text x="120" y="230" fill="#263845" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">
    <tspan x="120" dy="0">Descarga gratis nuestra</tspan>
    <tspan x="120" dy="56">guia de marketing digital</tspan>
  </text>
  <text x="120" y="370" fill="#64727E" font-family="Arial, Helvetica, sans-serif" font-size="25">
    <tspan x="120" dy="0">Aprende conceptos basicos para planear</tspan>
    <tspan x="120" dy="34">campanas digitales con mayor claridad.</tspan>
  </text>

  <!-- Descriptive text block -->
  <rect x="120" y="445" width="330" height="190" rx="8" fill="#F2F5F8" stroke="#DCE3EA"/>
  <text x="148" y="498" fill="#52616D" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="148" dy="0">En esta guia encontraras</tspan>
    <tspan x="148" dy="34">recomendaciones para</tspan>
    <tspan x="148" dy="34">organizar tus objetivos,</tspan>
    <tspan x="148" dy="34">audiencias y metricas.</tspan>
  </text>

  <!-- E-book placeholder -->
  <g>
    <rect x="510" y="420" width="210" height="270" rx="8" fill="#E8EEF3" stroke="#B9C8D4" stroke-width="3"/>
    <rect x="536" y="452" width="158" height="30" rx="4" fill="#B8C8D3"/>
    <rect x="536" y="508" width="134" height="16" rx="4" fill="#CDD8E0"/>
    <rect x="536" y="538" width="158" height="16" rx="4" fill="#CDD8E0"/>
    <rect x="536" y="568" width="118" height="16" rx="4" fill="#CDD8E0"/>
    <rect x="565" y="620" width="100" height="38" rx="5" fill="#5E7C91"/>
    <text x="586" y="645" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GUIA</text>
    <path d="M720 436L748 462V706H552" stroke="#D7E0E7" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <line x1="120" y1="760" x2="780" y2="760" stroke="#D9E0E7" stroke-width="2"/>

  <!-- Form -->
  <text x="120" y="825" fill="#263845" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Recibe la guia en tu correo</text>
  <text x="120" y="870" fill="#64727E" font-family="Arial, Helvetica, sans-serif" font-size="20">Completa tus datos para acceder al recurso.</text>

  <text x="120" y="940" fill="#52616D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Nombre</text>
  <rect x="120" y="960" width="660" height="64" rx="6" fill="#FFFFFF" stroke="#BFCAD3" stroke-width="2"/>
  <text x="148" y="1001" fill="#9AA7B1" font-family="Arial, Helvetica, sans-serif" font-size="19">Tu nombre</text>

  <text x="120" y="1070" fill="#52616D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Correo electronico</text>
  <rect x="120" y="1090" width="660" height="64" rx="6" fill="#FFFFFF" stroke="#BFCAD3" stroke-width="2"/>
  <text x="148" y="1131" fill="#9AA7B1" font-family="Arial, Helvetica, sans-serif" font-size="19">nombre@empresa.com</text>

  <rect x="120" y="1195" width="238" height="62" rx="6" fill="#4D6F84"/>
  <text x="154" y="1234" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Descargar guia</text>

  <!-- Footer note -->
  <text x="120" y="1318" fill="#8A98A3" font-family="Arial, Helvetica, sans-serif" font-size="17">Contenido ficticio para fines educativos.</text>
</svg>
