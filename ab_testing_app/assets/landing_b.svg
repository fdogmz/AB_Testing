<svg width="900" height="1400" viewBox="0 0 900 1400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mockup de landing page B para MarketPro</title>
  <desc id="desc">Version moderna de una landing page para descargar una guia gratuita de marketing digital.</desc>

  <!-- Background -->
  <rect width="900" height="1400" fill="#EEF6F7"/>
  <rect x="0" y="0" width="900" height="430" fill="#143D4F"/>
  <circle cx="790" cy="120" r="150" fill="#1F6E78" opacity="0.35"/>
  <circle cx="95" cy="380" r="110" fill="#F5B85E" opacity="0.2"/>

  <!-- Header -->
  <rect x="60" y="38" width="780" height="74" rx="14" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="102" cy="75" r="22" fill="#1F7A83"/>
  <path d="M90 84L98 64L105 78L112 64L121 84" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="85" fill="#173746" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">MarketPro</text>
  <text x="590" y="82" fill="#536471" font-family="Arial, Helvetica, sans-serif" font-size="17">Guia gratuita</text>
  <rect x="715" y="55" width="88" height="40" rx="20" fill="#F2A94B"/>
  <text x="736" y="81" fill="#173746" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Nuevo</text>

  <!-- Hero -->
  <text x="70" y="210" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800">
    <tspan x="70" dy="0">Impulsa tus campanas:</tspan>
    <tspan x="70" dy="62">descarga la guia gratuita</tspan>
  </text>
  <text x="72" y="352" fill="#D6E8EA" font-family="Arial, Helvetica, sans-serif" font-size="24">
    <tspan x="72" dy="0">Ideas practicas para convertir mejor, comunicar con claridad</tspan>
    <tspan x="72" dy="34">y medir el impacto de tus acciones digitales.</tspan>
  </text>

  <!-- E-book visual card -->
  <g>
    <rect x="530" y="470" width="260" height="330" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="565" y="510" width="190" height="250" rx="15" fill="#F7FAFC" stroke="#D6E4E7" stroke-width="2"/>
    <rect x="590" y="540" width="140" height="36" rx="7" fill="#1F7A83"/>
    <text x="621" y="565" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">GUIA</text>
    <rect x="590" y="605" width="135" height="14" rx="7" fill="#BFDADF"/>
    <rect x="590" y="634" width="112" height="14" rx="7" fill="#D7E8EB"/>
    <rect x="590" y="663" width="145" height="14" rx="7" fill="#D7E8EB"/>
    <circle cx="660" cy="720" r="28" fill="#F2A94B"/>
    <path d="M647 720L657 730L676 710" stroke="#173746" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Benefits card -->
  <rect x="70" y="470" width="410" height="330" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="105" y="535" fill="#173746" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Lo que aprenderas</text>

  <circle cx="118" cy="596" r="15" fill="#DDF3EF"/>
  <path d="M111 596L116 601L126 590" stroke="#1F7A83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="604" fill="#324B58" font-family="Arial, Helvetica, sans-serif" font-size="22">Mejora tu tasa de conversion</text>

  <circle cx="118" cy="662" r="15" fill="#DDF3EF"/>
  <path d="M111 662L116 667L126 656" stroke="#1F7A83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="670" fill="#324B58" font-family="Arial, Helvetica, sans-serif" font-size="22">Disena campanas mas efectivas</text>

  <circle cx="118" cy="728" r="15" fill="#DDF3EF"/>
  <path d="M111 728L116 733L126 722" stroke="#1F7A83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="736" fill="#324B58" font-family="Arial, Helvetica, sans-serif" font-size="22">Aprende a medir resultados</text>

  <!-- Form card -->
  <rect x="70" y="860" width="760" height="400" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="115" y="930" fill="#173746" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">Recibe la guia y empieza hoy</text>
  <text x="115" y="975" fill="#5E717B" font-family="Arial, Helvetica, sans-serif" font-size="21">Deja tus datos y accede al recurso gratuito.</text>

  <rect x="115" y="1030" width="310" height="70" rx="14" fill="#F4F8FA" stroke="#CFE0E4" stroke-width="2"/>
  <text x="140" y="1073" fill="#7B8E98" font-family="Arial, Helvetica, sans-serif" font-size="20">Nombre</text>

  <rect x="455" y="1030" width="330" height="70" rx="14" fill="#F4F8FA" stroke="#CFE0E4" stroke-width="2"/>
  <text x="480" y="1073" fill="#7B8E98" font-family="Arial, Helvetica, sans-serif" font-size="20">Correo electronico</text>

  <rect x="115" y="1140" width="670" height="72" rx="18" fill="#F2A94B"/>
  <text x="353" y="1186" fill="#173746" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Quiero mi guia</text>

  <!-- Trust strip -->
  <rect x="115" y="1290" width="670" height="54" rx="14" fill="#FFFFFF" stroke="#D5E5E8" stroke-width="2"/>
  <circle cx="150" cy="1317" r="9" fill="#1F7A83"/>
  <text x="173" y="1324" fill="#6A7D87" font-family="Arial, Helvetica, sans-serif" font-size="18">Contenido ficticio para una actividad educativa de A/B Testing.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B2E3A" flood-opacity="0.13"/>
    </filter>
  </defs>
</svg>
